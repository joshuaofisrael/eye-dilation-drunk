name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  expo-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Required Expo files
        run: |
          test -f package.json
          test -f app.json
          test -f App.tsx
          test -f index.ts
          test -f src/screens/DisclaimerScreen.tsx
          test -f src/screens/ScanScreen.tsx
          test -f src/screens/ResultScreen.tsx
          test -f src/lib/pupilAnalyzer.ts
          grep -q 'expo-camera' package.json
          grep -q 'enableTorch' src/screens/ScanScreen.tsx
          grep -q 'I understand — for entertainment only' src/screens/DisclaimerScreen.tsx
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
